<line x1="428" y1="134" x2="428" y2="114" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
<text x="462" y="130" fill="#8A8A92" font-size="11.5">RATIO</text>
<text x="462" y="148" fill="#F4F4F6" font-size="14" font-weight="600">4:1</text>

<circle cx="574" cy="134" r="24" fill="none" stroke="#26262A" stroke-width="3.5"/>
<path d="M 557 151 A 24 24 0 0 1 559 117" fill="none" stroke="#F0A03E" stroke-width="3.5" stroke-linecap="round"/>
<line x1="574" y1="134" x2="558" y2="119" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
<text x="608" y="130" fill="#8A8A92" font-size="11.5">ATTACK</text>
<text x="608" y="148" fill="#F4F4F6" font-size="14" font-weight="600">12 ms</text>

<circle cx="726" cy="134" r="24" fill="none" stroke="#26262A" stroke-width="3.5"/>
<path d="M 709 151 A 24 24 0 1 1 743 151" fill="none" stroke="#F0A03E" stroke-width="3.5" stroke-linecap="round"/>
<line x1="726" y1="134" x2="742" y2="150" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
<text x="760" y="130" fill="#8A8A92" font-size="11.5">RELEASE</text>
<text x="760" y="148" fill="#F4F4F6" font-size="14" font-weight="600">180 ms</text>

<circle cx="888" cy="134" r="24" fill="none" stroke="#26262A" stroke-width="3.5"/>
<path d="M 871 151 A 24 24 0 0 1 888 110" fill="none" stroke="#F0A03E" stroke-width="3.5" stroke-linecap="round"/>
