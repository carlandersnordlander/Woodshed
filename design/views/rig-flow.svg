<text x="922" y="148" fill="#F4F4F6" font-size="14" font-weight="600">+3.0 dB</text>

<!-- the one reading a compressor has, on the same line as the knobs that cause it -->
<text x="1046" y="122" fill="#55555C" font-size="11.5">GAIN REDUCTION</text>
<rect x="1046" y="132" width="240" height="10" rx="5" fill="#0F0F12"/>
<rect x="1046" y="132" width="88" height="10" rx="5" fill="#F0A03E" opacity="0.75"/>
<text x="1046" y="160" fill="#8A8A92" font-size="12">-4.4 dB</text>

<!-- drag handle and remove, at the end of the row they belong to -->
<g stroke="#2A2A2E" stroke-width="1.6">
  <line x1="1318" y1="126" x2="1330" y2="126"/><line x1="1318" y1="134" x2="1330" y2="134"/><line x1="1318" y1="142" x2="1330" y2="142"/>
</g>
<line x1="1350" y1="128" x2="1362" y2="140" stroke="#3A3A40" stroke-width="1.6" stroke-linecap="round"/>
<line x1="1362" y1="128" x2="1350" y2="140" stroke="#3A3A40" stroke-width="1.6" stroke-linecap="round"/>

<!-- ============================ the fork ============================ -->
<!--
  Drawn once, where it happens. The two branch columns start under its arms, so the shape of the
  routing is the shape of the layout rather than something to be read off a legend.
