<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Segoe UI, Inter, system-ui, sans-serif">
<!--
  The Rig view as it is, with the proportions and the signal line from the sketch. Every concept
  stays: a surface you drag blocks around on, the line they sit on, the connectors on that line
  with settings of their own, the start and end points that carry the interface's in and out, and
  the panel underneath for whatever is selected.

  What changes is size. The chain gets the share of the window the sketch gives it, the blocks
  get big enough to read without a caption in six point type, and the panel underneath stops
  being five columns of equal weight.
-->

<rect width="1440" height="900" fill="#060607"/>

<!-- ============================ nav rail ============================ -->
<rect x="0" y="0" width="54" height="900" fill="#101012"/>
<rect x="0" y="72" width="2" height="44" fill="#F0A03E"/>
<path d="M 21 28 L 21 48 L 37 38 Z" fill="#8A8A92"/>
<rect x="16" y="84" width="22" height="14" rx="2" fill="none" stroke="#F4F4F6" stroke-width="1.7"/>
<circle cx="22" cy="91" r="1.4" fill="#F4F4F6"/><circle cx="27" cy="91" r="1.4" fill="#F4F4F6"/><circle cx="32" cy="91" r="1.4" fill="#F4F4F6"/>
<rect x="18" y="101" width="18" height="21" rx="2" fill="none" stroke="#F4F4F6" stroke-width="1.7"/>
<circle cx="27" cy="111" r="5" fill="none" stroke="#F4F4F6" stroke-width="1.7"/>
<path d="M 21 146 L 21 166 M 33 146 L 33 166 M 21 166 Q 27 174 33 166" fill="none" stroke="#8A8A92" stroke-width="1.7"/>
<path d="M 19 214 L 24 194 L 30 194 L 35 214 Z" fill="none" stroke="#8A8A92" stroke-width="1.7"/>
<line x1="27" y1="212" x2="30" y2="197" stroke="#8A8A92" stroke-width="1.7"/>
<rect x="18" y="248" width="4" height="16" fill="#8A8A92"/><rect x="25" y="244" width="4" height="20" fill="#8A8A92"/><rect x="32" y="252" width="4" height="12" fill="#8A8A92"/>
<circle cx="27" cy="790" r="15" fill="none" stroke="#26262A" stroke-width="3"/>
<path d="M 16 801 A 15 15 0 0 1 21 777" fill="none" stroke="#F0A03E" stroke-width="3" stroke-linecap="round"/>
<line x1="27" y1="790" x2="21" y2="781" stroke="#FFFFFF" stroke-width="2"/>
<text x="27" y="820" fill="#8A8A92" font-size="11" text-anchor="middle">-34</text>
<circle cx="27" cy="856" r="15" fill="none" stroke="#26262A" stroke-width="3"/>
<line x1="27" y1="856" x2="27" y2="844" stroke="#FFFFFF" stroke-width="2"/>
<text x="27" y="886" fill="#8A8A92" font-size="11" text-anchor="middle">3.0</text>

<!-- ============================ header ============================ -->
<text x="78" y="40" fill="#F4F4F6" font-size="19" font-weight="600">Unsaved rig</text>
<path d="M 234 34 L 243 34 L 238.5 40 Z" fill="#8A8A92"/>
<text x="1352" y="39" fill="#8A8A92" font-size="12" text-anchor="end">CHAIN</text>
<circle cx="1380" cy="34" r="13" fill="none" stroke="#F0A03E" stroke-width="2"/>
<line x1="1380" y1="22" x2="1380" y2="34" stroke="#060607" stroke-width="5"/>
<line x1="1380" y1="23" x2="1380" y2="33" stroke="#F0A03E" stroke-width="2" stroke-linecap="round"/>

<!--
  ============================ the chain ============================
  56 to 560: the share the sketch gives it. The two lanes are centred in that, so adding a
  parallel section grows the picture from the middle instead of leaving a field of nothing
  under it - which is where the two hundred and forty empty pixels went.
-->

<!-- the line: one straight run, square corners on the branch -->
<line x1="94" y1="230" x2="1350" y2="230" stroke="#33333A" stroke-width="2"/>
<path d="M 343 230 L 343 390 L 1175 390 L 1175 230" fill="none" stroke="#33333A" stroke-width="2"/>

<!-- start point: the interface's input, its level and its trim, on the point they enter at -->
<rect x="70" y="222" width="17" height="17" rx="2" fill="#0B0B0D" stroke="#55555C" stroke-width="1.6"/>
<line x1="75" y1="226" x2="75" y2="235" stroke="#55555C" stroke-width="1.2"/>
<line x1="82" y1="226" x2="82" y2="235" stroke="#55555C" stroke-width="1.2"/>
<text x="78" y="210" fill="#55555C" font-size="11" font-weight="600" letter-spacing="1">IN</text>
<text x="78" y="258" fill="#3A3A40" font-size="11">Input 1   -3.5</text>

<!-- COMP. 88 square: large enough to read the type and its one telling number, small enough that
     the line still reads as a line of blocks rather than a row of panels. -->
<rect x="138" y="186" width="88" height="88" rx="8" fill="#0B0B0D" stroke="#26262A" stroke-width="1"/>
<circle cx="156" cy="204" r="4.5" fill="#F0A03E"/>
<text x="182" y="234" fill="#F4F4F6" font-size="15" font-weight="600" text-anchor="middle">COMP</text>
<text x="182" y="254" fill="#55555C" font-size="10.5" text-anchor="middle">4:1  -18 dB</text>
<text x="182" y="298" fill="#3A3A40" font-size="11" text-anchor="middle">GR -4.4</text>

<!-- the split connector: a handle you slide along the line -->
<rect x="335" y="222" width="17" height="17" rx="2" fill="#0B0B0D" stroke="#F0A03E" stroke-width="1.6"/>
<line x1="340" y1="226" x2="340" y2="235" stroke="#F0A03E" stroke-width="1.2"/>
<line x1="347" y1="226" x2="347" y2="235" stroke="#F0A03E" stroke-width="1.2"/>
<text x="343" y="210" fill="#3A3A40" font-size="11" text-anchor="middle">split</text>

<!-- upper lane -->
<rect x="384" y="186" width="88" height="88" rx="8" fill="#0B0B0D" stroke="#26262A" stroke-width="1"/>
<circle cx="402" cy="204" r="4.5" fill="#F0A03E"/>
<text x="428" y="234" fill="#F4F4F6" font-size="15" font-weight="600" text-anchor="middle">COMP</text>
<text x="428" y="254" fill="#55555C" font-size="10.5" text-anchor="middle">2:1  -24 dB</text>

<rect x="685" y="186" width="88" height="88" rx="8" fill="#0B0B0D" stroke="#26262A" stroke-width="1"/>
<circle cx="703" cy="204" r="4.5" fill="#F0A03E"/>
<text x="729" y="238" fill="#F4F4F6" font-size="15" font-weight="600" text-anchor="middle">NAM</text>
<text x="729" y="298" fill="#8A8A92" font-size="12" text-anchor="middle">Ampeg SVT - SM75</text>

<rect x="986" y="186" width="88" height="88" rx="8" fill="#0B0B0D" stroke="#26262A" stroke-width="1"/>
<circle cx="1004" cy="204" r="4.5" fill="#F0A03E"/>
<text x="1030" y="234" fill="#F4F4F6" font-size="15" font-weight="600" text-anchor="middle">EQ</text>
<text x="1030" y="254" fill="#55555C" font-size="10.5" text-anchor="middle">+4.5 @ 840</text>

<!-- lower lane. The selected block is outlined, the way a selected track is in the Play view -->
<rect x="384" y="346" width="88" height="88" rx="8" fill="#0B0B0D" stroke="#26262A" stroke-width="1"/>
<circle cx="402" cy="364" r="4.5" fill="none" stroke="#55555C" stroke-width="1.5"/>
<text x="428" y="394" fill="#55555C" font-size="15" font-weight="600" text-anchor="middle">COMP</text>
<text x="428" y="414" fill="#3A3A40" font-size="10.5" text-anchor="middle">2:1  -30 dB</text>

<rect x="685" y="346" width="88" height="88" rx="8" fill="#0B0B0D" stroke="#F0A03E" stroke-width="1.5"/>
<circle cx="703" cy="364" r="4.5" fill="#F0A03E"/>
<text x="729" y="398" fill="#F4F4F6" font-size="15" font-weight="600" text-anchor="middle">NAM</text>
<text x="729" y="458" fill="#8A8A92" font-size="12" text-anchor="middle">Darkglass B7K</text>

<rect x="986" y="346" width="88" height="88" rx="8" fill="#0B0B0D" stroke="#26262A" stroke-width="1"/>
<circle cx="1004" cy="364" r="4.5" fill="#F0A03E"/>
<text x="1030" y="394" fill="#F4F4F6" font-size="15" font-weight="600" text-anchor="middle">EQ</text>
<text x="1030" y="414" fill="#55555C" font-size="10.5" text-anchor="middle">-3.0 @ 120</text>

<!-- the merge connector -->
<rect x="1167" y="222" width="17" height="17" rx="2" fill="#0B0B0D" stroke="#F0A03E" stroke-width="1.6"/>
<line x1="1172" y1="226" x2="1172" y2="235" stroke="#F0A03E" stroke-width="1.2"/>
<line x1="1179" y1="226" x2="1179" y2="235" stroke="#F0A03E" stroke-width="1.2"/>
<text x="1175" y="210" fill="#3A3A40" font-size="11" text-anchor="middle">merge</text>
<text x="1175" y="258" fill="#3A3A40" font-size="11" text-anchor="middle">40 / 60</text>

<!-- add, and the end point -->
<rect x="1246" y="186" width="88" height="88" rx="8" fill="none" stroke="#1A1A1D" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="1290" y1="220" x2="1290" y2="240" stroke="#3A3A40" stroke-width="1.8"/>
<line x1="1280" y1="230" x2="1300" y2="230" stroke="#3A3A40" stroke-width="1.8"/>
<text x="1290" y="298" fill="#3A3A40" font-size="11" text-anchor="middle">add</text>

<rect x="1350" y="222" width="17" height="17" rx="2" fill="#0B0B0D" stroke="#55555C" stroke-width="1.6"/>
<line x1="1355" y1="226" x2="1355" y2="235" stroke="#55555C" stroke-width="1.2"/>
<line x1="1362" y1="226" x2="1362" y2="235" stroke="#55555C" stroke-width="1.2"/>
<text x="1367" y="210" fill="#55555C" font-size="11" font-weight="600" letter-spacing="1" text-anchor="end">OUT</text>
<text x="1382" y="258" fill="#3A3A40" font-size="11" text-anchor="end">Out 1/2   -0.6</text>

<!-- the drop hint, on the lane it would land in -->
<rect x="1246" y="346" width="88" height="88" rx="8" fill="none" stroke="#141417" stroke-width="1" stroke-dasharray="4 4"/>

<line x1="78" y1="560" x2="1382" y2="560" stroke="#1A1A1D" stroke-width="1"/>

<!--
  ============================ the panel ============================
  Same job as before - what is selected, and everything it has - but with a header instead of a
  column. Power, name, type and remove are the block itself, so they go on one line at the top;
  under it only what this type has, in named groups.
-->

<circle cx="98" cy="596" r="13" fill="none" stroke="#F0A03E" stroke-width="2"/>
<line x1="98" y1="584" x2="98" y2="596" stroke="#060607" stroke-width="5"/>
<line x1="98" y1="585" x2="98" y2="595" stroke="#F0A03E" stroke-width="2" stroke-linecap="round"/>

<text x="128" y="603" fill="#F4F4F6" font-size="18" font-weight="600">NAM</text>

<!-- type stays a segmented row, in the header, instead of a column down the left edge -->
<rect x="232" y="582" width="66" height="28" rx="5" fill="#F0A03E" fill-opacity="0.16" stroke="#F0A03E" stroke-width="1"/>
<text x="265" y="601" fill="#F0A03E" font-size="12.5" text-anchor="middle">NAM</text>
<rect x="302" y="582" width="66" height="28" rx="5" fill="#060607" stroke="#26262A" stroke-width="1"/>
<text x="335" y="601" fill="#55555C" font-size="12.5" text-anchor="middle">IR</text>
<rect x="372" y="582" width="66" height="28" rx="5" fill="#060607" stroke="#26262A" stroke-width="1"/>
<text x="405" y="601" fill="#55555C" font-size="12.5" text-anchor="middle">CUT</text>
<rect x="442" y="582" width="66" height="28" rx="5" fill="#060607" stroke="#26262A" stroke-width="1"/>
<text x="475" y="601" fill="#55555C" font-size="12.5" text-anchor="middle">COMP</text>
<rect x="512" y="582" width="66" height="28" rx="5" fill="#060607" stroke="#26262A" stroke-width="1"/>
<text x="545" y="601" fill="#55555C" font-size="12.5" text-anchor="middle">EQ</text>

<!-- remove, at the end of the line that names what it removes -->
<line x1="1352" y1="590" x2="1364" y2="602" stroke="#55555C" stroke-width="1.6" stroke-linecap="round"/>
<line x1="1364" y1="590" x2="1352" y2="602" stroke="#55555C" stroke-width="1.6" stroke-linecap="round"/>

<line x1="78" y1="630" x2="1382" y2="630" stroke="#141417" stroke-width="1"/>

<!-- capture: a field with the name in it, and the list behind it -->
<text x="78" y="662" fill="#55555C" font-size="12.3" font-weight="600" letter-spacing="1.2">CAPTURE</text>
<rect x="78" y="676" width="332" height="46" rx="6" fill="#0F0F12"/>
<text x="94" y="696" fill="#F4F4F6" font-size="14">Darkglass B7K</text>
<text x="94" y="713" fill="#55555C" font-size="11.5">Darkglass Microtubes B7K Ultra</text>
