<circle cx="796" cy="712" r="24" fill="none" stroke="#26262A" stroke-width="3.5"/>
<path d="M 779 729 A 24 24 0 0 1 783 692" fill="none" stroke="#F0A03E" stroke-width="3.5" stroke-linecap="round"/>
