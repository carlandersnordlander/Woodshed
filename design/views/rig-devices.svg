<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Segoe UI, Inter, system-ui, sans-serif">
<!--
  The Rig view with the split taken out: no chain strip on top and no editor underneath, because
  a NAM block has a capture and four knobs and there is no arrangement of four knobs that fills
  thirteen hundred pixels. The chain is the editor. Every block is a column, in signal order,
  carrying its own controls, and the whole window is that one row.

  It is how a pedalboard reads, how Ableton's device chain reads, and how every multi-effect
  built since the nineties reads. Nothing is selected, so nothing is hidden, and the empty band
  in the middle of the screen has nowhere to come from.

  Columns are as wide as the space divided by what is in the chain. Below about 200px a column
  folds to its header alone and opens again when pressed, so a long chain scrolls sideways
  instead of shrinking to nothing.
-->

<rect width="1440" height="900" fill="#060607"/>

<!-- ============================ nav rail ============================ -->
