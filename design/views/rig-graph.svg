<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Segoe UI, Inter, system-ui, sans-serif">
<!--
  The chain as the diagram it already is.

  Four things are on this surface and nothing else: an input, blocks, an output, and the wires
  between them. The wires are objects - each one has a handle you can grab, each one has
  settings, and dragging a fork's handle along the chain is how a parallel section is moved to
  start or end somewhere else.

  The blocks are wide enough to say what they are and what is loaded into them, because a
  diagram whose nodes are four-letter squares is a diagram you have to remember rather than read.

  Nothing is selected. A block's own controls open in place, under the block, so the surface
  stays one thing instead of a picture on top and an editor underneath.
-->

<rect width="1440" height="900" fill="#060607"/>

<!-- ============================ nav rail ============================ -->
<rect x="0" y="0" width="54" height="900" fill="#101012"/>
<rect x="0" y="72" width="2" height="44" fill="#F0A03E"/>
<path d="M 21 28 L 21 48 L 37 38 Z" fill="#8A8A92"/>
<rect x="16" y="84" width="22" height="14" rx="2" fill="none" stroke="#F4F4F6" stroke-width="1.7"/>
<circle cx="22" cy="91" r="1.4" fill="#F4F4F6"/><circle cx="27" cy="91" r="1.4" fill="#F4F4F6"/><circle cx="32" cy="91" r="1.4" fill="#F4F4F6"/>
<rect x="18" y="101" width="18" height="21" rx="2" fill="none" stroke="#F4F4F6" stroke-width="1.7"/>
<circle cx="27" cy="111" r="5" fill="none" stroke="#F4F4F6" stroke-width="1.7"/>
<path d="M 21 146 L 21 166 M 33 146 L 33 166 M 21 166 Q 27 174 33 166" fill="none" stroke="#8A8A92" stroke-width="1.7"/>
<path d="M 19 214 L 24 194 L 30 194 L 35 214 Z" fill="none" stroke="#8A8A92" stroke-width="1.7"/>
<line x1="27" y1="212" x2="30" y2="197" stroke="#8A8A92" stroke-width="1.7"/>
<rect x="18" y="248" width="4" height="16" fill="#8A8A92"/><rect x="25" y="244" width="4" height="20" fill="#8A8A92"/><rect x="32" y="252" width="4" height="12" fill="#8A8A92"/>
<circle cx="27" cy="856" r="15" fill="none" stroke="#26262A" stroke-width="3"/>
<line x1="27" y1="856" x2="27" y2="844" stroke="#FFFFFF" stroke-width="2"/>
<text x="27" y="886" fill="#8A8A92" font-size="11" text-anchor="middle">3.0</text>

<!-- ============================ header ============================ -->
<text x="78" y="42" fill="#F4F4F6" font-size="19" font-weight="600">Bass, parallel dirt</text>
<path d="M 258 36 L 267 36 L 262.5 42 Z" fill="#8A8A92"/>
<text x="1352" y="41" fill="#8A8A92" font-size="12" text-anchor="end">CHAIN</text>
<circle cx="1380" cy="36" r="13" fill="none" stroke="#F0A03E" stroke-width="2"/>
<line x1="1380" y1="24" x2="1380" y2="36" stroke="#060607" stroke-width="5"/>
<line x1="1380" y1="25" x2="1380" y2="35" stroke="#F0A03E" stroke-width="2" stroke-linecap="round"/>

<!-- ============================ wires ============================ -->
<!-- Drawn first so every node sits on top of them. -->
<line x1="248" y1="250" x2="300" y2="250" stroke="#33333A" stroke-width="2"/>
<line x1="460" y1="250" x2="512" y2="250" stroke="#33333A" stroke-width="2"/>
<line x1="672" y1="250" x2="886" y2="250" stroke="#33333A" stroke-width="2"/>
<line x1="886" y1="250" x2="944" y2="250" stroke="#33333A" stroke-width="2"/>
<line x1="1104" y1="250" x2="1180" y2="250" stroke="#33333A" stroke-width="2"/>

<!--
  The fork down to the branch and back up again. Square corners, never a curve: a rounded
  corner is a drawing of a cable, and this is a diagram of a signal path. Right angles also
  make every corner a place a handle can sit exactly, which a curve does not.
-->
<path d="M 486 250 L 486 430 L 512 430" fill="none" stroke="#33333A" stroke-width="2"/>
<path d="M 860 430 L 886 430 L 886 250" fill="none" stroke="#33333A" stroke-width="2"/>
<line x1="672" y1="430" x2="700" y2="430" stroke="#33333A" stroke-width="2"/>

<!-- ============================ IN ============================ -->
<!--
  The chain starts somewhere, and where it starts is a real setting: which input of the
  interface, how hot it is coming in, and the trim that puts it where a capture wants it. That
  lived in a bar at the top of the window with no connection to the picture it feeds.
-->
<rect x="78" y="182" width="170" height="136" rx="8" fill="#0B0B0D" stroke="#26262A" stroke-width="1"/>
<text x="96" y="208" fill="#55555C" font-size="12.3" font-weight="600" letter-spacing="1.2">IN</text>

<rect x="96" y="220" width="134" height="28" rx="5" fill="#0F0F12"/>
<text x="108" y="239" fill="#F4F4F6" font-size="12.5">Input 1</text>
<path d="M 206 233 L 216 233 L 211 240 Z" fill="#55555C"/>

<circle cx="126" cy="284" r="22" fill="none" stroke="#26262A" stroke-width="3.5"/>
<path d="M 110 300 A 22 22 0 0 1 118 264" fill="none" stroke="#F0A03E" stroke-width="3.5" stroke-linecap="round"/>
<line x1="126" y1="284" x2="116" y2="266" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
<text x="156" y="280" fill="#8A8A92" font-size="11">GAIN</text>
<text x="156" y="296" fill="#F4F4F6" font-size="13" font-weight="600">-3.5</text>

<!-- the level, where the level enters -->
<rect x="212" y="262" width="8" height="44" rx="4" fill="#0F0F12"/>
<rect x="212" y="282" width="8" height="24" rx="4" fill="#6CC684" opacity="0.85"/>

<!-- ============================ COMP ============================ -->
<rect x="300" y="214" width="160" height="72" rx="8" fill="#0B0B0D" stroke="#26262A" stroke-width="1"/>
<circle cx="318" cy="236" r="4.5" fill="#F0A03E"/>
<text x="332" y="241" fill="#F4F4F6" font-size="13.5" font-weight="600">COMP</text>
<path d="M 396 234 L 405 234 L 400.5 240 Z" fill="#3A3A40"/>
<text x="318" y="268" fill="#55555C" font-size="11.5">4:1   -18 dB   GR -4.4</text>

<!-- ============================ the split ============================ -->
<!--
  A connector, not a decoration. Grab it and slide it along the chain and the section starts
  somewhere else; the blocks it passes move between the main line and the branch as it goes.
-->
<circle cx="486" cy="250" r="7" fill="#0B0B0D" stroke="#F0A03E" stroke-width="2"/>
<g stroke="#F0A03E" stroke-width="1.4" opacity="0.9">
  <line x1="483" y1="247" x2="483" y2="253"/><line x1="489" y1="247" x2="489" y2="253"/>
</g>
<text x="486" y="228" fill="#3A3A40" font-size="11" text-anchor="middle">split</text>

<!-- ============================ main branch ============================ -->
<rect x="512" y="214" width="160" height="72" rx="8" fill="#0B0B0D" stroke="#26262A" stroke-width="1"/>
<circle cx="530" cy="236" r="4.5" fill="#F0A03E"/>
<text x="544" y="241" fill="#F4F4F6" font-size="13.5" font-weight="600">NAM</text>
<path d="M 600 234 L 609 234 L 604.5 240 Z" fill="#3A3A40"/>
<text x="530" y="268" fill="#8A8A92" font-size="11.5">Ampeg SVT - SM75</text>

<!-- an empty slot on the wire: this is where a dragged block lands -->
<rect x="712" y="228" width="132" height="44" rx="6" fill="none" stroke="#17171A" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="778" y1="242" x2="778" y2="258" stroke="#2E2E33" stroke-width="1.6"/>
<line x1="770" y1="250" x2="786" y2="250" stroke="#2E2E33" stroke-width="1.6"/>

<!-- ============================ lower branch ============================ -->
<rect x="512" y="394" width="160" height="72" rx="8" fill="#0B0B0D" stroke="#26262A" stroke-width="1"/>
<circle cx="530" cy="416" r="4.5" fill="#F0A03E"/>
<text x="544" y="421" fill="#F4F4F6" font-size="13.5" font-weight="600">NAM</text>
<path d="M 600 414 L 609 414 L 604.5 420 Z" fill="#3A3A40"/>
<text x="530" y="448" fill="#8A8A92" font-size="11.5">Darkglass B7K</text>

<rect x="700" y="394" width="160" height="72" rx="8" fill="#0B0B0D" stroke="#26262A" stroke-width="1"/>
<circle cx="718" cy="416" r="4.5" fill="#F0A03E"/>
<text x="732" y="421" fill="#F4F4F6" font-size="13.5" font-weight="600">IR</text>
<path d="M 776 414 L 785 414 L 780.5 420 Z" fill="#3A3A40"/>
<text x="718" y="448" fill="#8A8A92" font-size="11.5">Ampeg 8x10 - R121</text>

<!-- a plain wire has a handle too: every connector has settings -->
<circle cx="686" cy="430" r="5" fill="#0B0B0D" stroke="#33333A" stroke-width="2"/>

<!-- ============================ the merge, with its settings open ============================ -->
<circle cx="886" cy="250" r="7" fill="#0B0B0D" stroke="#F0A03E" stroke-width="2"/>
<g stroke="#F0A03E" stroke-width="1.4" opacity="0.9">
  <line x1="883" y1="247" x2="883" y2="253"/><line x1="889" y1="247" x2="889" y2="253"/>
</g>
<text x="886" y="228" fill="#3A3A40" font-size="11" text-anchor="middle">merge</text>

<!--
  Settings hang off the connector they belong to, on the wire, rather than in a panel somewhere
  else that has to name which connector it is talking about.
-->
<line x1="886" y1="330" x2="886" y2="360" stroke="#26262A" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="700" y="360" width="372" height="196" rx="8" fill="#141417" stroke="#26262A" stroke-width="1"/>
<text x="722" y="390" fill="#55555C" font-size="12.3" font-weight="600" letter-spacing="1.2">MERGE</text>

<text x="722" y="428" fill="#8A8A92" font-size="12">Balance</text>
<rect x="722" y="440" width="286" height="6" rx="3" fill="#0F0F12"/>
<rect x="722" y="440" width="114" height="6" rx="3" fill="#F0A03E" opacity="0.8"/>
<circle cx="836" cy="443" r="7" fill="#F0A03E"/>
<text x="1026" y="448" fill="#F4F4F6" font-size="13" font-weight="600">40 / 60</text>
<text x="722" y="466" fill="#3A3A40" font-size="11">main</text>
<text x="1008" y="466" fill="#3A3A40" font-size="11" text-anchor="end">branch</text>

<text x="722" y="502" fill="#8A8A92" font-size="12">Branch trim</text>
<rect x="830" y="488" width="120" height="6" rx="3" fill="#0F0F12"/>
<rect x="830" y="488" width="52" height="6" rx="3" fill="#F0A03E" opacity="0.8"/>
<circle cx="882" cy="491" r="6" fill="#F0A03E"/>
<text x="966" y="498" fill="#F4F4F6" font-size="13" font-weight="600">-2.5 dB</text>

<!-- phase: the one thing a parallel path gets wrong on its own, so it is offered here -->
<text x="722" y="534" fill="#8A8A92" font-size="12">Invert branch</text>
<rect x="830" y="518" width="44" height="24" rx="12" fill="#0F0F12"/>
<circle cx="842" cy="530" r="9" fill="#55555C"/>
<text x="890" y="534" fill="#3A3A40" font-size="11">for when the two paths cancel</text>

<!-- ============================ EQ ============================ -->
<rect x="944" y="214" width="160" height="72" rx="8" fill="#0B0B0D" stroke="#26262A" stroke-width="1"/>
<circle cx="962" cy="236" r="4.5" fill="#F0A03E"/>
<text x="976" y="241" fill="#F4F4F6" font-size="13.5" font-weight="600">EQ</text>
<path d="M 1024 234 L 1033 234 L 1028.5 240 Z" fill="#3A3A40"/>
<text x="962" y="268" fill="#55555C" font-size="11.5">4 bands   +4.5 @ 840</text>

<!-- ============================ OUT ============================ -->
<rect x="1180" y="182" width="170" height="136" rx="8" fill="#0B0B0D" stroke="#26262A" stroke-width="1"/>
<text x="1198" y="208" fill="#55555C" font-size="12.3" font-weight="600" letter-spacing="1.2">OUT</text>

<rect x="1198" y="220" width="134" height="28" rx="5" fill="#0F0F12"/>
<text x="1210" y="239" fill="#F4F4F6" font-size="12.5">Out 1 / 2</text>
<path d="M 1308 233 L 1318 233 L 1313 240 Z" fill="#55555C"/>

<circle cx="1228" cy="284" r="22" fill="none" stroke="#26262A" stroke-width="3.5"/>
<path d="M 1212 300 A 22 22 0 0 1 1228 262" fill="none" stroke="#F0A03E" stroke-width="3.5" stroke-linecap="round"/>
<line x1="1228" y1="284" x2="1228" y2="266" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
<text x="1258" y="280" fill="#8A8A92" font-size="11">GAIN</text>
<text x="1258" y="296" fill="#F4F4F6" font-size="13" font-weight="600">-0.6</text>

<rect x="1314" y="262" width="8" height="44" rx="4" fill="#0F0F12"/>
<rect x="1314" y="274" width="8" height="32" rx="4" fill="#6CC684" opacity="0.85"/>

<!-- ============================ a block, opened in place ============================ -->
<!--
  Pressing a block opens it where it stands. The diagram above stays exactly as it was - nothing
  scrolls away, nothing is replaced - and this is what removes the need for a fixed editor and
  the empty half of the window it left behind.
-->
<line x1="592" y1="286" x2="592" y2="606" stroke="#26262A" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="78" y="606" width="620" height="182" rx="8" fill="#141417" stroke="#26262A" stroke-width="1"/>
<circle cx="102" cy="634" r="5" fill="#F0A03E"/>
<text x="120" y="639" fill="#F4F4F6" font-size="14" font-weight="600">NAM</text>
<path d="M 176 632 L 185 632 L 180.5 638 Z" fill="#55555C"/>
<text x="662" y="639" fill="#55555C" font-size="12" text-anchor="end">close</text>

<rect x="102" y="656" width="290" height="42" rx="6" fill="#0F0F12"/>
<text x="118" y="674" fill="#F4F4F6" font-size="13">Ampeg SVT - SM75</text>
<text x="118" y="691" fill="#55555C" font-size="11">Ampeg SVT Classic with 6x10</text>
<path d="M 366 673 L 378 673 L 372 681 Z" fill="#8A8A92"/>

<rect x="404" y="656" width="88" height="42" rx="6" fill="#060607" stroke="#26262A" stroke-width="1"/>
<text x="448" y="682" fill="#8A8A92" font-size="12.5" text-anchor="middle">Browse…</text>

<circle cx="130" cy="742" r="22" fill="none" stroke="#26262A" stroke-width="3.5"/>
<path d="M 114 758 A 22 22 0 0 1 130 720" fill="none" stroke="#F0A03E" stroke-width="3.5" stroke-linecap="round"/>
<line x1="130" y1="742" x2="130" y2="724" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
<text x="160" y="738" fill="#8A8A92" font-size="11">GAIN</text>
<text x="160" y="754" fill="#F4F4F6" font-size="13" font-weight="600">+0.0</text>

<circle cx="270" cy="742" r="22" fill="none" stroke="#26262A" stroke-width="3.5"/>
<path d="M 254 758 A 22 22 0 1 1 286 758" fill="none" stroke="#F0A03E" stroke-width="3.5" stroke-linecap="round"/>
<line x1="270" y1="742" x2="286" y2="758" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
<text x="300" y="738" fill="#8A8A92" font-size="11">BLEND</text>
<text x="300" y="754" fill="#F4F4F6" font-size="13" font-weight="600">100%</text>

<circle cx="410" cy="742" r="22" fill="none" stroke="#26262A" stroke-width="3.5"/>
<path d="M 394 758 A 22 22 0 0 1 398 716" fill="none" stroke="#F0A03E" stroke-width="3.5" stroke-linecap="round"/>
<line x1="410" y1="742" x2="396" y2="718" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
<text x="440" y="738" fill="#8A8A92" font-size="11">VOLUME</text>
<text x="440" y="754" fill="#F4F4F6" font-size="13" font-weight="600">-4.6</text>

<line x1="540" y1="716" x2="540" y2="768" stroke="#1E1E22" stroke-width="1"/>
<text x="562" y="732" fill="#8A8A92" font-size="11.5">TONE</text>
<path d="M 636 726 L 645 726 L 640.5 732 Z" fill="#55555C"/>
<text x="562" y="758" fill="#3A3A40" font-size="11">flat</text>

<!-- ============================ transport ============================ -->
<line x1="54" y1="820" x2="1440" y2="820" stroke="#1A1A1D" stroke-width="1"/>
<g>
  <path d="M 688 852 L 688 872 M 704 852 L 704 872 L 690 862 Z" fill="#8A8A92"/>
  <path d="M 736 852 L 736 872 L 722 862 Z M 752 852 L 752 872 L 738 862 Z" fill="#8A8A92"/>
  <path d="M 786 850 L 806 862 L 786 874 Z" fill="#8A8A92"/>
  <rect x="834" y="853" width="18" height="18" rx="2" fill="#8A8A92"/>
  <path d="M 884 852 L 884 872 L 898 862 Z M 900 852 L 900 872 L 914 862 Z" fill="#8A8A92"/>
</g>
<text x="626" y="898" fill="#8A8A92" font-size="12">0:00.0</text>
<rect x="672" y="892" width="480" height="3" rx="2" fill="#26262A"/>
<circle cx="676" cy="893" r="5" fill="#8A8A92"/>
<text x="1166" y="898" fill="#55555C" font-size="12">0:00.0</text>
</svg>
