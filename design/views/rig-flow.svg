<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Segoe UI, Inter, system-ui, sans-serif">
<!--
  The chain runs down the window instead of across it.

  That is the whole idea, and everything else follows from it. A window is wider than it is tall,
  so laying the signal path along the short axis is what forced the old layout into a thin strip
  on top and an editor underneath - and a block's controls into a row of circles spread over
  thirteen hundred pixels.

  Downwards, a block is a full-width row and its controls sit along that row where there is room
  for them. Nothing is selected, so nothing is hidden, and there is no editor to split off.

  And a parallel section is two columns side by side for the length of the branch, which is what
  a fork looks like. Three lanes across a strip could show one block per branch before the
  columns collided; two columns down the page hold as many as the branch has.
-->

<rect width="1440" height="900" fill="#060607"/>

<!-- ============================ nav rail ============================ -->
<rect x="0" y="0" width="54" height="900" fill="#101012"/>
<rect x="0" y="72" width="2" height="44" fill="#F0A03E"/>
<path d="M 21 28 L 21 48 L 37 38 Z" fill="#8A8A92"/>
<rect x="16" y="84" width="22" height="14" rx="2" fill="none" stroke="#F4F4F6" stroke-width="1.7"/>
<circle cx="22" cy="91" r="1.4" fill="#F4F4F6"/><circle cx="27" cy="91" r="1.4" fill="#F4F4F6"/><circle cx="32" cy="91" r="1.4" fill="#F4F4F6"/>
<rect x="18" y="101" width="18" height="21" rx="2" fill="none" stroke="#F4F4F6" stroke-width="1.7"/>
<circle cx="27" cy="111" r="5" fill="none" stroke="#F4F4F6" stroke-width="1.7"/>
<path d="M 21 146 L 21 166 M 33 146 L 33 166 M 21 166 Q 27 174 33 166" fill="none" stroke="#8A8A92" stroke-width="1.7"/>
<path d="M 19 214 L 24 194 L 30 194 L 35 214 Z" fill="none" stroke="#8A8A92" stroke-width="1.7"/>
<line x1="27" y1="212" x2="30" y2="197" stroke="#8A8A92" stroke-width="1.7"/>
<rect x="18" y="248" width="4" height="16" fill="#8A8A92"/><rect x="25" y="244" width="4" height="20" fill="#8A8A92"/><rect x="32" y="252" width="4" height="12" fill="#8A8A92"/>
<circle cx="27" cy="790" r="15" fill="none" stroke="#26262A" stroke-width="3"/>
<path d="M 16 801 A 15 15 0 0 1 21 777" fill="none" stroke="#F0A03E" stroke-width="3" stroke-linecap="round"/>
<line x1="27" y1="790" x2="21" y2="781" stroke="#FFFFFF" stroke-width="2"/>
<text x="27" y="820" fill="#8A8A92" font-size="11" text-anchor="middle">-34</text>
<circle cx="27" cy="856" r="15" fill="none" stroke="#26262A" stroke-width="3"/>
<line x1="27" y1="856" x2="27" y2="844" stroke="#FFFFFF" stroke-width="2"/>
<text x="27" y="886" fill="#8A8A92" font-size="11" text-anchor="middle">3.0</text>

<!-- ============================ header ============================ -->
<text x="78" y="42" fill="#F4F4F6" font-size="19" font-weight="600">Bass, parallel dirt</text>
<path d="M 258 36 L 267 36 L 262.5 42 Z" fill="#8A8A92"/>
<text x="1352" y="41" fill="#8A8A92" font-size="12" text-anchor="end">CHAIN</text>
<circle cx="1380" cy="36" r="13" fill="none" stroke="#F0A03E" stroke-width="2"/>
<line x1="1380" y1="24" x2="1380" y2="36" stroke="#060607" stroke-width="5"/>
<line x1="1380" y1="25" x2="1380" y2="35" stroke="#F0A03E" stroke-width="2" stroke-linecap="round"/>

<!-- ============================ block 1: COMP ============================ -->
<!--
  A row is 92 tall and the full width. The controls run along it: knob, then its name over its
  value. A compressor's five knobs and its gain reduction fit in one line with room to spare -
  which is the room the old layout had to spread them into circles across the screen to fill.
-->
<rect x="78" y="88" width="1304" height="92" rx="8" fill="#0B0B0D"/>
<circle cx="102" cy="134" r="5" fill="#F0A03E"/>
<text x="120" y="130" fill="#F4F4F6" font-size="14" font-weight="600">COMP</text>
<path d="M 178 126 L 187 126 L 182.5 132 Z" fill="#55555C"/>
<text x="120" y="150" fill="#3A3A40" font-size="11.5">1</text>

<line x1="212" y1="104" x2="212" y2="164" stroke="#1A1A1D" stroke-width="1"/>

<circle cx="256" cy="134" r="24" fill="none" stroke="#26262A" stroke-width="3.5"/>
<path d="M 239 151 A 24 24 0 0 1 244 117" fill="none" stroke="#F0A03E" stroke-width="3.5" stroke-linecap="round"/>
<line x1="256" y1="134" x2="242" y2="118" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
<text x="290" y="130" fill="#8A8A92" font-size="11.5">THRESHOLD</text>
<text x="290" y="148" fill="#F4F4F6" font-size="14" font-weight="600">-18.0 dB</text>

<circle cx="428" cy="134" r="24" fill="none" stroke="#26262A" stroke-width="3.5"/>
