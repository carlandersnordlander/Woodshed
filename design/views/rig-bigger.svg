<text x="830" y="708" fill="#8A8A92" font-size="11.5">VOLUME</text>
<text x="830" y="726" fill="#F4F4F6" font-size="14" font-weight="600">-4.6</text>

<line x1="912" y1="650" x2="912" y2="780" stroke="#141417" stroke-width="1"/>

<!-- tone -->
<text x="946" y="662" fill="#55555C" font-size="12.3" font-weight="600" letter-spacing="1.2">TONE</text>
